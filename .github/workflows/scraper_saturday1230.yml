name: saturday_scraper 1230

on:
  workflow_dispatch:
  schedule:
    # 設定每週六台灣時間中午 12:30 (UTC 04:30) 自動執行
    - cron: '30 4 * * 6'

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
    - name: 📥 1. 取得專案代碼
      uses: actions/checkout@v4

    - name: 🐍 2. 設定 Python 3.10 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 🌟 升級裝備：安裝 xvfb 虛擬螢幕與 undetected-chromedriver
    - name: 📦 3. 安裝爬蟲套件與虛擬顯示器
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        python -m pip install --upgrade pip
        pip install selenium pandas lxml html5lib requests beautifulsoup4 undetected-chromedriver

    # 🌟 升級裝備：使用 xvfb-run 啟動 Python，欺騙網站這是一台有實體螢幕的電腦
    - name: 🚀 4. 執行籌碼爬蟲腳本
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python "saturday1230_scraper.py"

    - name: 🔄 5. 更新遠端進度 (避免衝突)
      run: |
        git pull --rebase --autostash origin main

    - name: 💾 6. 自動將產生的 CSV 提交並上傳回 GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 自動排程：更新週六大股東籌碼資料"
        file_pattern: 'data/*'
